<!DOCTYPE html>
<html>
<head>
<title>Heart Challenge 💖</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>

body {
    margin: 0;
    background: linear-gradient(to right, #ff758c, #ff7eb3);
    overflow: hidden;
    font-family: Arial, sans-serif;
    text-align: center;
    color: white;
}

h1 {
    margin-top: 20px;
}

#scoreBoard {
    font-size: 20px;
    margin-top: 10px;
}

#timer {
    font-size: 18px;
}

#gameArea {
    position: relative;
    width: 100%;
    height: 80vh;
}

.heart {
    position: absolute;
    font-size: 30px;
    cursor: pointer;
}

</style>
</head>
<body>

<h1>Catch 10 Hearts in 15 Seconds 💖</h1>
<div id="scoreBoard">Score: 0</div>
<div id="timer">Time: 15</div>
<div id="gameArea"></div>

<script>

let score = 0;
let timeLeft = 15;
let gameArea = document.getElementById("gameArea");

let heartInterval = setInterval(createHeart, 700);
let timerInterval = setInterval(updateTimer, 1000);

function createHeart() {
    let heart = document.createElement("div");
    heart.classList.add("heart");
    heart.innerHTML = "💖";

    heart.style.left = Math.random() * (window.innerWidth - 50) + "px";
    heart.style.top = Math.random() * (window.innerHeight * 0.7) + "px";

    heart.onclick = function() {
        score++;
        document.getElementById("scoreBoard").innerText = "Score: " + score;
        heart.remove();
    };

    gameArea.appendChild(heart);

    setTimeout(() => {
        heart.remove();
    }, 2000);
}

function updateTimer() {
    timeLeft--;
    document.getElementById("timer").innerText = "Time: " + timeLeft;

    if (timeLeft <= 0) {
        endGame();
    }
}

function endGame() {
    clearInterval(heartInterval);
    clearInterval(timerInterval);

    if (score < 10) {
        window.close(); // close silently if not completed
    }
}

</script>

</body>
</html>
